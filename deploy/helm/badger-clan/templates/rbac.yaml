apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: {{ include "badger-clan.fullname" . }} }
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: {{ include "badger-clan.fullname" . }} }
subjects:
  - kind: ServiceAccount
    name: {{ include "badger-clan.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "badger-clan.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
