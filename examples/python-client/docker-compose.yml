services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: badger
      POSTGRES_USER: badger
      POSTGRES_PASSWORD: badger
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badger -d badger"]
      interval: 2s
      timeout: 2s
      retries: 15
